name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          command -v rustup >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck --severity=warning bin/rumb-scan tui/export-themes

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tui/Cargo.toml | head -n 1)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME does not match tui/Cargo.toml version $version"; exit 1; }
