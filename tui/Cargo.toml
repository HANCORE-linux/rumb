[package]
name = "rumb"
version = "0.1.7"
edition = "2024"
description = "Track software health. Spot trouble early."
license = "MIT"
repository = "https://github.com/HANCORE-linux/rumb"

[dependencies]
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
image = { version = "0.25.6", default-features = false }
libc = "0.2"
